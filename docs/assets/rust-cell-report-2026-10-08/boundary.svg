   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203043" x="26.73" y="49.582125" transform="rotate(-0 26.73 49.582125)">TypeScript host (trusted)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 71.901637)">Model credentials / registered handlers</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 86.138825)">Tool selection / session management</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 100.376013)">Bash and handlers retain OS permissions</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203043" x="308.52" y="49.582125" transform="rotate(-0 308.52 49.582125)">WasmEdge guest (interpreter or host AOT)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 71.901637)">Non-network WASI import allowlist</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 86.138825)">Explicit project / state / lib / scratch preopens</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 100.376013)">Cell deadline; optional gas / memory pages</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 114.6132)">Private stdio bridge to selected host handlers</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203043" x="26.73" y="210.358125" transform="rotate(-0 26.73 210.358125)">Cargo / AOT compiler (trusted toolchain)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 232.677638)">Environment allowlist</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 246.914825)">Cargo sandbox / cgroup: Linux opt-in</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(26.73 261.152013)">No whole-agent sandbox guarantee</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203043" x="308.52" y="210.358125" transform="rotate(-0 308.52 210.358125)">Admission and artifact checks</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 232.677638)">Inspect imports; strip guest custom sections</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 246.914825)">Host AOT only; verify core Wasm / provenance</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #203043" transform="translate(308.52 261.152013)">Compiled artifacts are outside guest preopens</text>
   </g>
