name: Nightly Process Stress

on:
  workflow_dispatch:

concurrency:
  group: nightly-process-stress
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-stress:
    name: Process stress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise concurrent native workers
        run: cargo test --release --locked -p pa-daemon --test worker_orphan_exit_e2e --test create_reuse_e2e
