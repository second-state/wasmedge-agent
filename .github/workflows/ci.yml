name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones that target main. A stacked pull
  # request has the branch below it as its base, so a filter on main meant the
  # stack's upper pull requests reported no checks at all -- and the whole
  # point of splitting a change into a stack is reviewing each piece on its
  # own evidence. Pushes stay on main, so a branch still gets one run per pull
  # request rather than two.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      WASMEDGE_AGENT_WASMEDGE: ${{ github.workspace }}/.wasmedge/bin/wasmedge
      WASMEDGE_AGENT_TEMPLATE_DIR: ${{ github.workspace }}/wasmedge-agent-runtime/template
      GIT_CONFIG_GLOBAL: /dev/null
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # These dependencies come from Ubuntu, not the runner's third-party repositories.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y fd-find ripgrep bubblewrap dbus-user-session
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Allow Bubblewrap user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          # Scope Ubuntu's AppArmor exception to bwrap; keep the global restriction enabled.
          sudo tee /etc/apparmor.d/wasmedge-agent-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile wasmedge-agent-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/wasmedge-agent-ci-bwrap
          bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session --cap-drop ALL --ro-bind / / -- /usr/bin/true

      - name: Enable process resource controllers (Linux)
        if: runner.os == 'Linux'
        run: |
          user_unit="user@$(id -u).service"
          sudo mkdir -p "/run/systemd/system/$user_unit.d"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "/run/systemd/system/$user_unit.d/50-process-limits.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart "$user_unit"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemd-run --user --scope --expand-environment=no --quiet --collect \
            -p MemoryMax=128M -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUQuota=100% -p TasksMax=64 /usr/bin/true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd

      - name: Install the wasm32-wasip1 target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add wasm32-wasip1

      - name: Install WasmEdge
        run: |
          curl -fsSL https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh |
            bash -s -- -v 0.14.1 -p "$GITHUB_WORKSPACE/.wasmedge"
          "$WASMEDGE_AGENT_WASMEDGE" --version

      - name: Install the rustdoc JSON test toolchain
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --target wasm32-wasip1

      - name: Cache cargo and the template build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            wasmedge-agent-runtime/template/vendor
            wasmedge-agent-runtime/template/target
          key: cell-template-${{ runner.os }}-${{ hashFiles('wasmedge-agent-runtime/template/Cargo.lock') }}

      - name: Vendor and warm the template
        working-directory: wasmedge-agent-runtime/template
        run: |
          test -d vendor || cargo vendor --locked vendor
          cargo build --release -p cell
          test -f target/wasm32-wasip1/release/cell.wasm

      - name: Guest crate native tests
        working-directory: wasmedge-agent-runtime/template/rlm
        run: |
          HOST_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --release --target "$HOST_TRIPLE"

      - name: Check the workspace
        run: cargo run --locked -p xtask -- check

      - name: Native libraries and public SDK
        run: |
          cargo test --release --locked --workspace --lib
          cargo test --release --locked --doc -p wasmedge-agent-sdk
          cargo test --release --locked -p pa-cli --test installer_platform_map --test installer_update_e2e --test release_workflow
          cargo test --release --locked -p pa-core --test release_channel_manifest

      - name: Run real WasmEdge cells without Node
        run: |
          cargo build --release --locked --bin wasmedge-agent
          cargo test --release --locked -p pa-cli --test native_cells --no-run
          WASMEDGE_AGENT_CARGO=$(command -v cargo)
          export WASMEDGE_AGENT_CARGO
          mkdir "$RUNNER_TEMP/native-tools"
          python3 - <<'PY'
          import os
          from pathlib import Path
          dest = Path(os.environ["RUNNER_TEMP"]) / "native-tools"
          for directory in os.get_exec_path():
              for binary in Path(directory).glob("*"):
                  if binary.name in {"node", "nodejs", "npm", "npx", "bun", "corepack", "pnpm", "yarn"}:
                      continue
                  link = dest / binary.name
                  if binary.is_file() and os.access(binary, os.X_OK) and not link.exists():
                      link.symlink_to(binary.resolve() if not binary.is_symlink() else binary.absolute())
          PY
          export PATH="$RUNNER_TEMP/native-tools"
          if command -v node || command -v npm; then exit 1; fi
          cargo test --release --locked -p pa-cli --test native_cells -- --ignored

      - name: Verify native release archives
        run: |
          platform=linux-x64
          if [ "$RUNNER_OS" = macOS ]; then platform=darwin-arm64; fi
          mkdir -p "target/release-hosts/$platform"
          cp target/release/wasmedge-agent "target/release-hosts/$platform/"
          cargo run --release --locked -p xtask -- pack --base-url https://github.com/second-state/wasmedge-agent/releases --platform "$platform"
          cd target/dist/artifacts
          shasum -a 256 -c SHA256SUMS
          set -- "$PWD"/*-"$platform".tar.gz
          WASMEDGE_AGENT_RUST_PREFIX="$RUNNER_TEMP/native-install" WASMEDGE_AGENT_BOOTSTRAP_ON_INSTALL=0 sh install.sh --archive "$1"
          "$RUNNER_TEMP/native-install/bin/wasmedge-agent" --version

  windows-package:
    name: Windows native package
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build the Windows executable and SDK
        shell: bash
        run: |
          cargo build --release --locked --bin wasmedge-agent
          cargo test --release --locked -p wasmedge-agent-sdk
          mkdir -p target/release-hosts/win32-x64
          cp target/release/wasmedge-agent.exe target/release-hosts/win32-x64/
      - name: Package and install through Git Bash
        shell: bash
        run: |
          (cd wasmedge-agent-runtime/template && cargo vendor --locked vendor)
          cargo run --release --locked -p xtask -- pack --platform win32-x64 --base-url https://github.com/second-state/wasmedge-agent/releases
          cd target/dist/artifacts
          sha256sum -c SHA256SUMS
          set -- "$PWD"/*-win32-x64.tar.gz
          WASMEDGE_AGENT_RUST_PREFIX="$RUNNER_TEMP/native-install" WASMEDGE_AGENT_BOOTSTRAP_ON_INSTALL=0 sh install.sh --archive "$1"
      - name: Run the installed Windows launcher
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/native-install/bin/wasmedge-agent.cmd" --version'

  build-check-test:
    name: build-check-test
    if: always()
    needs: [native, windows-package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify native checks
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WINDOWS_RESULT: ${{ needs.windows-package.result }}
        run: test "$NATIVE_RESULT" = success && test "$WINDOWS_RESULT" = success
