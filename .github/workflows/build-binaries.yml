name: Release WasmEdge Agent

# Fork note: upstream releases on every main push; this fork keeps the
# workflow manual-only until its own release process exists (M5). That is why
# the channel is an input rather than a push trigger: everything below is
# inherited from a workflow whose beta half ran on every commit to the default
# branch, and with only a dispatch event the beta half was unreachable -- the
# artifacts, the pointers, the installer, the tag and the release could not
# advance by any invocation the workflow accepts.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to publish'
        required: true
        default: production
        type: choice
        options:
          - production
          - beta
      release_tag:
        description: 'Production release tag to create or update (e.g., v0.0.1). Ignored for beta.'
        required: false
        type: string

concurrency:
  group: release-wasmedge-agent
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      beta_version: ${{ steps.context.outputs.beta_version }}
      build_ref: ${{ steps.context.outputs.build_ref }}
      production_version: ${{ steps.context.outputs.production_version }}
      publish_beta: ${{ steps.context.outputs.publish_beta }}
      publish_production: ${{ steps.context.outputs.publish_production }}
      release_base_url: ${{ steps.base_url.outputs.release_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release context
        id: context
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || 'production' }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          beta_version=
          build_ref=
          production_version=
          publish_beta=false
          publish_production=false

          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_CHANNEL" = beta ]; then
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Manual releases must run from the default branch (${DEFAULT_BRANCH}), not ${REF_NAME}." >&2
              exit 1
            fi
            # Beta names itself from package.json plus this run, the way the
            # inherited push trigger did. Nothing about it is a choice the
            # dispatcher makes, so release_tag is not read here.
            #
            # The run, and not the attempt: a re-run finishes the release its
            # first attempt started. Publishing under a version that moved with
            # the attempt left the original destination -- immutable objects, a
            # tag and a GitHub release -- permanently half-published, with the
            # retry announcing a different release beside it.
            production_version=$(node -p "require('./package.json').version")
            build_ref="$GITHUB_SHA_VALUE"
            beta_version="${production_version}-beta.${RUN_NUMBER}.${GITHUB_SHA_VALUE::7}"
            publish_beta=true
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$INPUT_RELEASE_TAG" ]; then
              echo "A production release needs release_tag (e.g., v0.0.1)." >&2
              exit 1
            fi
            # From the default branch, or from the tag being published. The
            # second is how a run that failed partway is finished: a tag names
            # one commit, so re-running from it rebuilds the same bytes, and
            # the immutability guards confirm what already went up instead of
            # replacing it. Without it the only advice this workflow could
            # give after a partial release -- re-run from the tagged commit --
            # was advice it then refused to accept, because the branch had
            # moved and the tag no longer named its head.
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && [ "$REF_NAME" != "$INPUT_RELEASE_TAG" ]; then
              echo "Manual releases run from ${DEFAULT_BRANCH} or from ${INPUT_RELEASE_TAG}, not ${REF_NAME}." >&2
              exit 1
            fi
            production_version="${INPUT_RELEASE_TAG#v}"
            build_ref="$GITHUB_SHA_VALUE"
            # A manual release names a version and builds whatever the default
            # branch points at now, which are two independent choices. A
            # GitHub release's assets are written once, and
            # guard-immutable-github-assets.sh refuses a rebuild that produced
            # different bytes -- but that guard runs in the publish job, after
            # build has already spent the time producing those bytes. So a
            # second run from a moved branch has to be refused here, before it
            # gets that far. Refuse unless the tag that already exists is this
            # commit; a version with no tag yet is free.
            if git rev-parse -q --verify "refs/tags/v${production_version}^{commit}" >/dev/null 2>&1; then
              tagged_sha=$(git rev-parse "refs/tags/v${production_version}^{commit}")
              if [ "$tagged_sha" != "$GITHUB_SHA_VALUE" ]; then
                echo "v${production_version} already exists and names ${tagged_sha}, but this run builds ${GITHUB_SHA_VALUE}." >&2
                echo "Release a new version, or re-run this workflow from the tagged commit." >&2
                exit 1
              fi
            fi
            publish_production=true
          elif [ "$REF_TYPE" = tag ]; then
            production_version="${REF_NAME#v}"
            build_ref="$REF_NAME"
            publish_production=true
          else
            production_version=$(node -p "require('./package.json').version")
            build_ref="$GITHUB_SHA_VALUE"
            beta_version="${production_version}-beta.${RUN_NUMBER}.${GITHUB_SHA_VALUE::7}"
            publish_beta=true

            previous_version=
            if [ -n "$BEFORE_SHA" ] && ! printf '%s\n' "$BEFORE_SHA" | grep -Eq '^0+$' && git cat-file -e "${BEFORE_SHA}:package.json"; then
              git show "${BEFORE_SHA}:package.json" > /tmp/previous-package.json
              previous_version=$(node -p "require('/tmp/previous-package.json').version")
            fi

            if [ -z "$previous_version" ] || [ "$production_version" != "$previous_version" ]; then
              if git show-ref --verify --quiet "refs/tags/v${production_version}"; then
                tagged_commit=$(git rev-list -n 1 "v${production_version}")
                if [ "$tagged_commit" != "$GITHUB_SHA_VALUE" ]; then
                  echo "Production v${production_version} already points to ${tagged_commit}, not ${GITHUB_SHA_VALUE}." >&2
                  exit 1
                fi
                echo "Retrying production v${production_version} for ${GITHUB_SHA_VALUE}."
              fi
              publish_production=true
            elif ! git show-ref --verify --quiet "refs/tags/v${production_version}"; then
              echo "Production v${production_version} has no tag; retrying the failed release."
              publish_production=true
            else
              echo "Package version is unchanged at ${production_version}; only beta will advance."
            fi
          fi

          if [ "$publish_production" = true ] && ! printf '%s\n' "$production_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Production version must be plain semver like 0.0.1: ${production_version}" >&2
            exit 1
          fi

          echo "beta_version=$beta_version" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "production_version=$production_version" >> "$GITHUB_OUTPUT"
          echo "publish_beta=$publish_beta" >> "$GITHUB_OUTPUT"
          echo "publish_production=$publish_production" >> "$GITHUB_OUTPUT"
          echo "Build ref: $build_ref"
          echo "Production: $publish_production ${production_version:+v${production_version}}"
          echo "Beta: $publish_beta ${beta_version:+v${beta_version}}"

      # Computed once, here, rather than spelled out at each of the three
      # sites that need it: both pack steps in build and the publish job's
      # own env. Every one of those `test -n` guards downstream stays --
      # this only removes the three copies of the expression they guard.
      - name: Resolve release base URL
        id: base_url
        env:
          RELEASE_BASE_URL: ${{ vars.WASMEDGE_AGENT_DOWNLOAD_BASE_URL || format('https://github.com/{0}/releases', github.repository) }}
        run: |
          echo "release_base_url=$RELEASE_BASE_URL" >> "$GITHUB_OUTPUT"

      # `npm run build` and `npm run check` are what the build job runs, and
      # check runs no tests -- it is biome, tsgo, and the render and audit
      # scripts. Everything a release is actually about is covered by tests and
      # by nothing else: the config-directory move, the compatibility alias and
      # the legacy environment names, postinstall, the update path, the
      # release-pack manifest, and the immutable guards above. So the release
      # workflow could publish a commit whose test suite was red, or whose
      # suite had not finished, and every check it does run would pass.
      #
      # Running the suite here would be a second copy of ci.yml's matrix --
      # seven shards plus the Rust cell job on two platforms -- kept in step by
      # hand. Requiring ci.yml's own aggregate result for this exact commit
      # asks the same question of the run that already answered it.
      #
      # It fails closed. A conclusion this step could not read is not a
      # conclusion that says the tests passed, and neither is a missing one:
      # ci.yml runs on pushes to the default branch and on pull requests, so a
      # commit with no run is a commit nothing has tested.
      - name: Require a green CI run for the commit being released
        env:
          BUILD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/${REPO}/commits/${BUILD_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "build-check-test") | .conclusion] | first // "missing"' \
            > "${RUNNER_TEMP}/ci-conclusion" 2> "${RUNNER_TEMP}/ci-conclusion.err"; then
            echo "Could not read the check runs for ${BUILD_SHA}; refusing to release." >&2
            cat "${RUNNER_TEMP}/ci-conclusion.err" >&2
            exit 1
          fi

          conclusion=$(cat "${RUNNER_TEMP}/ci-conclusion")
          if [ "$conclusion" != success ]; then
            echo "CI for ${BUILD_SHA} is '${conclusion}', not 'success'; refusing to release." >&2
            echo "The release workflow runs no tests of its own. Wait for CI, or fix it, and re-run." >&2
            exit 1
          fi
          echo "CI for ${BUILD_SHA}: success."

  build:
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Pack production release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          WASMEDGE_AGENT_DOWNLOAD_BASE_URL: ${{ needs.release-context.outputs.release_base_url }}
        run: |
          test -n "$WASMEDGE_AGENT_DOWNLOAD_BASE_URL"
          npm run release:pack -- \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --base-url "$WASMEDGE_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/production

      - name: Pack beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          WASMEDGE_AGENT_DOWNLOAD_BASE_URL: ${{ needs.release-context.outputs.release_base_url }}
        run: |
          test -n "$WASMEDGE_AGENT_DOWNLOAD_BASE_URL"
          npm run release:pack -- \
            --channel beta \
            --version "$BETA_VERSION" \
            --base-url "$WASMEDGE_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/beta

      - name: Upload production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wasmedge-agent-production
          path: packages/coding-agent/release/production/artifacts/*
          if-no-files-found: error

      - name: Upload beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wasmedge-agent-beta
          path: packages/coding-agent/release/beta/artifacts/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-context, build]
    permissions:
      contents: write
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
      RELEASE_BASE_URL: ${{ needs.release-context.outputs.release_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Download production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wasmedge-agent-production
          path: release-artifacts/production

      - name: Download beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wasmedge-agent-beta
          path: release-artifacts/beta

      - name: Prepare the channel assets
        run: |
          test -n "$RELEASE_BASE_URL"

          node - <<'NODE'
          const fs = require("node:fs");
          const baseUrl = process.env.RELEASE_BASE_URL;
          if (!baseUrl) throw new Error("RELEASE_BASE_URL is required");
          const installer = fs.readFileSync("install.sh", "utf8");
          // The rendered release is provenance: it records which release a
          // copy of the installer came from. An empty one leaves the
          // placeholder, which is correct, because this run is not publishing
          // that channel.
          const renderInstaller = (channel, version) => installer
            .replaceAll("__WASMEDGE_AGENT_DOWNLOAD_BASE_URL__", baseUrl)
            .replaceAll("__WASMEDGE_AGENT_DEFAULT_RELEASE_CHANNEL__", channel)
            .replaceAll("__WASMEDGE_AGENT_RENDERED_RELEASE__", version ? `v${version}` : "__WASMEDGE_AGENT_RENDERED_RELEASE__");

          // Stable needs no second release: the alias points at the version
          // release itself, so its channel objects ride along with it.
          if (fs.existsSync("release-artifacts/production")) {
            fs.writeFileSync("release-artifacts/production/install.sh", renderInstaller("stable", process.env.PRODUCTION_VERSION));
            fs.copyFileSync("release-artifacts/production/release.json", "release-artifacts/production/latest.json");
          }

          // Beta's channel objects go on a release of their own, because its
          // version releases are one tag per build and immutable.
          if (fs.existsSync("release-artifacts/beta")) {
            fs.mkdirSync("release-artifacts/beta-channel", { recursive: true });
            fs.writeFileSync("release-artifacts/beta-channel/install.sh", renderInstaller("beta", process.env.BETA_VERSION));
            fs.copyFileSync("release-artifacts/beta/release.json", "release-artifacts/beta-channel/beta.json");
            fs.copyFileSync("release-artifacts/beta/beta", "release-artifacts/beta-channel/beta");
          }
          NODE

      - name: Extract production release notes
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          awk "/^## \[${PRODUCTION_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${PRODUCTION_VERSION}" > /tmp/release-notes.md
          fi

      # Asked before anything is written. GitHub is the one destination now,
      # and its existing assets are what a rebuild of the same version has to
      # agree with; a refusal here -- or an unreadable answer, which refuses
      # too -- stops before any of this run's assets go up.
      #
      # The case is not hypothetical. Repacking an old version against a
      # different WASMEDGE_AGENT_DOWNLOAD_BASE_URL changes the tarball bytes,
      # because the packer records that host in the package. The tag check
      # passes, and the release's existing GitHub assets are the only thing
      # that objects.
      - name: Guard the production release destinations
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCTION_DIR=release-artifacts/production

          test -f "$PRODUCTION_DIR/wasmedge-agent-${PRODUCTION_VERSION}.tgz"
          test -f "$PRODUCTION_DIR/SHA256SUMS"
          test -f "$PRODUCTION_DIR/stable"
          test -f "$PRODUCTION_DIR/release.json"

          sh scripts/guard-immutable-github-assets.sh "$GITHUB_REPOSITORY" "v${PRODUCTION_VERSION}" "$PRODUCTION_DIR"

      # The tag before the bytes. A run that published GitHub release assets
      # and then failed before the tag existed stranded the version: retrying
      # from the default branch after it moved builds different bytes, which
      # guard-immutable-github-assets.sh refuses, and retrying from the
      # tagged commit was impossible because there was no tag naming it.
      # Created first, that recovery path exists for every failure after this
      # point.
      - name: Create the production tag
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${PRODUCTION_VERSION}"

          if tagged_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha 2>/dev/null); then
            # Resolved through commits/ rather than the ref, so an annotated
            # tag is compared by the commit it names rather than by its own
            # object.
            if [ "$tagged_sha" != "$BUILD_REF" ]; then
              echo "${RELEASE_TAG} already names ${tagged_sha}, and this run builds ${BUILD_REF}." >&2
              echo "Release a new version, or re-run this workflow from ${RELEASE_TAG}." >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already names this commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$BUILD_REF" > /dev/null
            echo "Created ${RELEASE_TAG} at ${BUILD_REF}."
          fi

      - name: Create production GitHub release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          PRODUCTION_DIR=release-artifacts/production

          # By version, not by date. See scripts/decide-release-latest.sh.
          LATEST=$(sh scripts/decide-release-latest.sh "$GITHUB_REPOSITORY" "$PRODUCTION_VERSION")

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # gh release view finds this release whether it is published or a
            # draft left by a create that died mid-upload -- but
            # publish-github-release-assets.sh reads releases/tags/<tag>, an
            # endpoint that never returns a draft, so a re-run against one
            # would fail one layer deeper with no explanation. Caught here
            # instead, naming what to do.
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
              echo "${RELEASE_TAG} is a draft left by a create that failed mid-upload." >&2
              echo "Delete it (gh release delete ${RELEASE_TAG} --yes) and re-run; the tag stays." >&2
              exit 1
            fi

            # Only what is missing, and each asset compared as it is decided
            # rather than trusted from the guard that ran before the artifacts
            # went up. Nothing is clobbered: --clobber deletes before it
            # uploads, which turns a retry into a window where a release that
            # was complete is missing a file it already had.
            sh scripts/publish-github-release-assets.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$PRODUCTION_DIR"
            gh release edit "$RELEASE_TAG" --latest="$LATEST"
          else
            # No --target: the step above created the tag, so the release
            # attaches to a ref that already names this commit.
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest="$LATEST" \
              "$PRODUCTION_DIR"/*
          fi

          # The flag is the request. This is the outcome, and it is what the
          # stable channel means: a gh that ignored --latest, or a release
          # marked latest by date behind our back, would leave every stable
          # install resolving a release this run did not choose.
          if [ "$LATEST" = true ]; then
            current=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [ "$current" != "$RELEASE_TAG" ]; then
              echo "Published ${RELEASE_TAG}, but the repository marks ${current} latest." >&2
              exit 1
            fi
          fi

          if [ "$LATEST" = false ]; then
            current=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [ "$current" = "$RELEASE_TAG" ]; then
              echo "Published ${RELEASE_TAG} as not latest, but the repository marks it latest." >&2
              exit 1
            fi
          fi

      # Both destinations first, for the reason the production pair has: the
      # beta channel pointer and the installers move in the step below, and a
      # guard that runs after them refuses only once they already name a build
      # the GitHub release does not carry.
      #
      # Beta tarballs carry the same one-year immutable policy as production
      # ones, so a rebuilt beta of an already-published version is the same
      # unfixable replacement. The GitHub side is checked the same way now
      # that each beta has a tag of its own: nothing there is rolling, so
      # nothing is exempt from the comparison.
      - name: Guard the beta release destinations
        if: env.PUBLISH_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BETA_DIR=release-artifacts/beta
          RELEASE_PREFIX="releases/v${BETA_VERSION}"

          test -f "$BETA_DIR/wasmedge-agent-${BETA_VERSION}.tgz"
          test -f "$BETA_DIR/SHA256SUMS"
          test -f "$BETA_DIR/beta"
          test -f "$BETA_DIR/release.json"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT_URL"

          sh scripts/guard-immutable-release.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" "$RELEASE_PREFIX" "$BETA_DIR"
          sh scripts/guard-immutable-github-assets.sh "$GITHUB_REPOSITORY" "v${BETA_VERSION}" "$BETA_DIR"

      - name: Publish immutable beta artifacts to R2
        if: env.PUBLISH_BETA == 'true'
        run: |
          BETA_DIR=release-artifacts/beta
          RELEASE_PREFIX="releases/v${BETA_VERSION}"

          # Conditional creation, for the reason the production objects have:
          # a beta prefix is immutable for a year too.
          for artifact in "$BETA_DIR"/*.tgz; do
            sh scripts/publish-immutable-object.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
              "${RELEASE_PREFIX}/$(basename "$artifact")" "$artifact" application/gzip
          done

          sh scripts/publish-immutable-object.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            "${RELEASE_PREFIX}/SHA256SUMS" "$BETA_DIR/SHA256SUMS" text/plain

          # Beside the tarballs, for the reason the production copy is there:
          # an install of this version resolves no channel and has nothing else
          # to hold these files to.
          sh scripts/publish-immutable-object.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            "${RELEASE_PREFIX}/release.json" "$BETA_DIR/release.json" application/json

      - name: Publish the beta GitHub release
        if: env.PUBLISH_BETA == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No freshness check here. This release is addressed by version, and
          # its immutable objects went up in the step above whether or not main
          # has moved since: stopping short of the GitHub half would leave the
          # two destinations disagreeing about what v${BETA_VERSION} is, with no
          # way to finish it -- a later run publishes a different version. What
          # a newer main commit has to stop is the channel pointer, and that is
          # checked immediately before the pointer moves, below.
          BETA_DIR=release-artifacts/beta
          printf 'Automated beta build from `%s` (`%s`).\n' "$DEFAULT_BRANCH" "$BUILD_REF" > /tmp/beta-release-notes.md

          # One tag per build, and nothing is ever overwritten. This used to be
          # a rolling pointer: the beta tag force-moved onto each build, then
          # SHA256SUMS, beta and beta.json clobbered one at a time under names
          # that never changed. A failure partway left that tag holding some of
          # this build and some of the last, while claiming to be one build.
          #
          # beta_version already ends in the run and the commit, so the tag
          # below is one no other build can take, and a re-run of this run
          # completes that tag rather than opening a second one. A create that
          # fails partway leaves an incomplete release under a tag nothing
          # points at yet -- the channel pointer moves in the step after this
          # one -- so a half-finished beta is invisible rather than installable.
          if gh release view "v${BETA_VERSION}" >/dev/null 2>&1; then
            # A re-run of this run, completing what its first attempt left
            # behind. Each asset is compared as it is decided, and nothing
            # already published is replaced.
            sh scripts/publish-github-release-assets.sh "$GITHUB_REPOSITORY" "v${BETA_VERSION}" "$BETA_DIR"
          else
            gh release create "v${BETA_VERSION}" \
              --title "Beta (v${BETA_VERSION})" \
              --target "$BUILD_REF" \
              --notes-file /tmp/beta-release-notes.md \
              --prerelease \
              "$BETA_DIR"/*
          fi

          # Both questions asked here, before any of these objects names this
          # build. The branch was last checked before the release above was
          # written, and main can move in that time: a run that answered it
          # once published a beta it had already decided was stale. The guard
          # is re-run for the reason the production one is -- nothing under
          # this prefix has been overwritten by this run, so a refusal costs a
          # retry rather than a repair.
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
          if [ "$latest_main_sha" != "$BUILD_REF" ]; then
            echo "A newer main commit exists; leaving the beta pointers where they are."
            echo "v${BETA_VERSION} is published and installable by version; nothing points at it."
            exit 0
          fi

          sh scripts/guard-immutable-release.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            "releases/v${BETA_VERSION}" "$BETA_DIR"

          # Then the text pointer, and the JSON manifest last, for the reason
          # the production pointers have: the JSON is the object both install
          # paths read, so it is what decides which release this channel means.
          #
          # Both move under the same condition. The freshness check above reads
          # the default branch and then writes, and main can advance between
          # the two -- so the ordering is carried by the objects themselves:
          # each write names a run number and refuses to publish under one that
          # is not newer than what the pointer already names, with the check and
          # the write made one operation by a condition on the ETag.
          pointer_status=0
          sh scripts/advance-channel-pointer.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            beta "$BETA_DIR/beta" text/plain beta-run || pointer_status=$?
          if [ "$pointer_status" -eq 3 ]; then
            echo "v${BETA_VERSION} is published and installable by version; the channel names a newer run."
            exit 0
          fi
          [ "$pointer_status" -eq 0 ] || exit "$pointer_status"

          # The beta installer, once this build is the one the channel names,
          # and written the way the pointers are. Only beta runs write it, and
          # they do not write install.sh at all any more: both steps wrote both
          # scripts with a plain copy, so a beta publication could put an older
          # stable installer at the canonical URL, and either could land its
          # copy after a newer run had published everything.
          pointer_status=0
          sh scripts/advance-channel-pointer.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            install-beta.sh /tmp/wasmedge-agent-install-beta.sh text/x-shellscript beta-run || pointer_status=$?
          [ "$pointer_status" -eq 0 ] || [ "$pointer_status" -eq 3 ] || exit "$pointer_status"

          # A stand-down here means a newer run took the channel in between,
          # which is the condition doing its job rather than a failure.
          pointer_status=0
          sh scripts/advance-channel-pointer.sh "$R2_BUCKET" "$R2_ENDPOINT_URL" \
            beta.json "$BETA_DIR/release.json" application/json beta-run || pointer_status=$?
          [ "$pointer_status" -eq 0 ] || [ "$pointer_status" -eq 3 ] || exit "$pointer_status"

          echo "Beta installer: ${R2_PUBLIC_BASE_URL%/}/install-beta.sh"
